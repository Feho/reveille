<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reveille</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/views.css" />
  </head>
  <body>
    <div class="shell hidden" id="shell">
      <header class="titlebar">
        <span class="wordmark">Reveille</span>
        <span class="titlebar__spacer"></span>
        <button type="button" id="reveille-update-btn" class="btn btn--sm btn--primary hidden">
          Update Reveille
        </button>
        <button
          type="button"
          id="install-chip"
          class="install-chip"
          title="Game folder, selected game, and active engine"
        >
          <span class="install-chip__path" id="install-chip-path"></span>
          <span class="install-chip__engine" id="install-chip-engine"></span>
        </button>
      </header>

      <div id="toolbar-slot"></div>

      <main class="split">
        <div id="list-slot"></div>
        <aside class="detail-pane" id="detail-slot" aria-label="Selected server"></aside>
      </main>

      <div id="status-slot"></div>
    </div>

    <div class="setup-root" id="setup-root"></div>

    <dialog id="info-dialog" aria-labelledby="info-dialog-title">
      <div class="dialog__head">
        <!-- Set by lib/dialog.js: one modal serves every panel. -->
        <h2 class="display heading-sm" id="info-dialog-title"></h2>
      </div>
      <div class="dialog__body" id="info-dialog-body"></div>
      <div class="dialog__foot">
        <button type="button" class="btn" id="info-dialog-close" autofocus>Close</button>
      </div>
    </dialog>

    <dialog
      id="reveille-update-dialog"
      aria-labelledby="reveille-update-title"
      aria-describedby="reveille-update-copy"
    >
      <div class="dialog__head">
        <h2 class="display heading-sm" id="reveille-update-title">Update Reveille</h2>
      </div>
      <div class="dialog__body">
        <p id="reveille-update-copy"></p>
        <p class="quiet">Reveille checks the update before installing it. The app will close and reopen.</p>
        <div id="reveille-update-progress" class="stack--tight hidden" role="status" aria-live="polite">
          <div id="reveille-update-meter" class="meter meter--indeterminate">
            <span id="reveille-update-meter-fill" class="meter__fill"></span>
          </div>
          <span id="reveille-update-status" class="quiet data"></span>
        </div>
        <p id="reveille-update-error" class="error hidden" role="alert"></p>
      </div>
      <div class="dialog__foot">
        <button type="button" class="btn btn--ghost hidden" id="reveille-update-stop">Stop download</button>
        <button type="button" class="btn" id="reveille-update-later">Later</button>
        <button type="button" class="btn btn--primary" id="reveille-update-install">Update and restart</button>
      </div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
