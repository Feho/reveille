<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reveille</title>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/base.css" />
    <link rel="stylesheet" href="styles/components.css" />
    <link rel="stylesheet" href="styles/views.css" />
  </head>
  <body>
    <div class="shell hidden" id="shell">
      <header class="titlebar">
        <span class="wordmark">Reveille</span>
        <span class="titlebar__spacer"></span>
        <button
          type="button"
          id="install-chip"
          class="install-chip"
          title="Game folder and OpenMoHAA"
        >
          <span class="install-chip__path" id="install-chip-path"></span>
        </button>
      </header>

      <div id="toolbar-slot"></div>

      <main class="split">
        <div id="list-slot"></div>
        <aside class="detail-pane" id="detail-slot" aria-label="Selected server"></aside>
      </main>

      <div id="status-slot"></div>
    </div>

    <div class="setup-root" id="setup-root"></div>

    <dialog id="info-dialog" aria-labelledby="info-dialog-title">
      <div class="dialog__head">
        <h2 class="display heading-sm" id="info-dialog-title">
          Registered but not listed
        </h2>
      </div>
      <div class="dialog__body" id="info-dialog-body"></div>
      <div class="dialog__foot">
        <button type="button" class="btn" id="info-dialog-close" autofocus>Close</button>
      </div>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
