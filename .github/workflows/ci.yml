name: CI

on:
  push:
  pull_request:

jobs:
  # The portable half. `reveille-core`, `reveille-cli`, and `reveille-platform`
  # must keep building off Windows so the macOS OpenMoHAA overlay (and a later
  # Linux shell) stay deferred rather than precluded. The Tauri shell is not
  # built here: Linux would need GTK/WebKit, and a .dmg is produced on a Mac.
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p reveille-core -p reveille-cli -p reveille-platform --locked
      - run: cargo clippy -p reveille-core -p reveille-cli -p reveille-platform --all-targets --locked -- -D warnings
      - run: cargo fmt --all --check

  # The whole workspace, including the Tauri shell. Packaging a macOS .app/.dmg
  # still needs a Mac; this job is the Windows NSIS target.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The shell's frontend has no build step, so nothing else would catch a
      # syntax error in it before the window opens blank.
      - name: Check the shell's JavaScript parses
        shell: bash
        run: find crates/reveille-app/ui -name '*.js' -print0 | xargs -0 -n1 node --check
