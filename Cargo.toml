# SPDX-License-Identifier: GPL-2.0-only

[workspace]
members = [
    "crates/reveille-core",
    "crates/reveille-platform",
    "crates/reveille-cli",
    "crates/reveille-app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"
rust-version = "1.85"

[workspace.dependencies]
clap = { version = "4.5", features = ["derive"] }
md-5 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.50", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
walkdir = "2.5"
winreg = "0.56"
zip = { version = "2.4", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
